<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Aunque la Mona se Vista de Seda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Aunque la Mona se Vista de Seda, Mona se Queda</h1>
    </header>

    <section class="banner">
        <div class="slides">
            <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9" class="active">
            <img src="https://images.unsplash.com/photo-1487412912498-0447578fcca8">
            <img src="https://images.unsplash.com/photo-1519415943484-9fa1873496d4">
        </div>
        <div class="banner-text">
            <h2>Resalta tu belleza natural</h2>
            <button onclick="abrirFormulario()">Agregar Cita</button>
        </div>
    </section>

    <section class="servicios">
        <h2>Nuestros Servicios</h2>
        <div class="cards">
            <div class="card">Maquillaje Profesional</div>
            <div class="card">Peinados</div>
            <div class="card">Manicure & Pedicure</div>
        </div>
    </section>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="cerrar" onclick="cerrarFormulario()">&times;</span>
            <h2>Agendar Cita</h2>
            <form id="formCita">
                <input type="text" placeholder="Nombre" required>
                <input type="date" required>
                <input type="time" required>
                <button type="submit">Guardar Cita</button>
            </form>
        </div>
    </div>

<script src="script.js">
    // Banner dinámico
let slides = document.querySelectorAll(".slides img");
let index = 0;

function cambiarSlide() {
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
}

setInterval(cambiarSlide, 4000);

// Modal
function abrirFormulario() {
    document.getElementById("modal").style.display = "flex";
}

function cerrarFormulario() {
    document.getElementById("modal").style.display = "none";
}

// Guardar cita
document.getElementById("formCita").addEventListener("submit", function(e){
    e.preventDefault();
    alert("Cita agendada con éxito 💅✨");
    cerrarFormulario();
});
</script>
</body>
</html>
